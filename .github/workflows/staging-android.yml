name: Android staging journey
on:
  workflow_dispatch:
  push:
    branches: [fix/customer-transaction-integrity]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: staging-apks
          path: app/build/outputs/apk/**/*.apk
  journey:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - size: phone
            profile: pixel_5
          - size: tablet
            profile: pixel_tablet
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: staging-apks
          path: apks
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          STAGING_KEY: ${{ matrix.size == 'phone' && secrets.FASTCASH_STAGING_PHONE || secrets.FASTCASH_STAGING_TABLET }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          script: |
            adb install apks/debug/app-debug.apk
            adb install apks/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e stagingKey "$STAGING_KEY" com.aistudio.fastcash.lkapp.test/androidx.test.runner.AndroidJUnitRunner > instrument.log
            cat instrument.log
            grep -F 'OK (3 tests)' instrument.log
